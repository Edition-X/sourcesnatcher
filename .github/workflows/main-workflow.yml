name: Build and Publish

on:
  push:
    branches: [ main ]

jobs:
  version-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # Auto-increment version based on commit messages
    - name: Bump version and push tag
      id: version_bump
      uses: anothrNick/github-tag-action@1.67.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
        DEFAULT_BUMP: patch
        RELEASE_BRANCHES: main
    
    # Update version in the package
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Update package version
      run: |
        # Extract version without 'v' prefix
        VERSION=$(echo ${{ steps.version_bump.outputs.new_tag }} | sed 's/^v//')
        echo "New version: $VERSION"
        
        # Update version in setup.py
        sed -i "s/version=\"[0-9]*\.[0-9]*\.[0-9]*\"/version=\"$VERSION\"/" setup.py
        
        # Update version in __init__.py
        sed -i "s/__version__ = \"[0-9]*\.[0-9]*\.[0-9]*\"/__version__ = \"$VERSION\"/" sourcesnatcher/__init__.py
    
    # Build and publish
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip_existing: true
    
    # Create GitHub release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version_bump.outputs.new_tag }}
        name: Release ${{ steps.version_bump.outputs.new_tag }}
        body: |
          Automated release for version ${{ steps.version_bump.outputs.new_tag }}
          
          Changes:
          ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
