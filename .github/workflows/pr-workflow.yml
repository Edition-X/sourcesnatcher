name: Pull Request Tests

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Security scan
      uses: pypa/gh-action-pip-audit@v1.0.8
      with:
        inputs: Pipfile

  test:
    needs: security-check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Check sensitive file changes
      run: |
        CHANGED_FILES=$(git diff --name-only origin/main..HEAD)
        SENSITIVE="setup.py|.github/workflows/|Pipfile"
        if echo "$CHANGED_FILES" | grep -E "$SENSITIVE"; then
          echo " Sensitive files detected: $(echo "$CHANGED_FILES" | grep -E "$SENSITIVE" | tr '\n' ' ')"
          if [[ ! "${{ contains(github.event.pull_request.labels.*.name, 'admin-approved') }}" == "true" ]]; then
            echo " Sensitive files changed - requires admin-approved label"
            echo "Changed files: $CHANGED_FILES"
            exit 1
          else
            echo " Sensitive files approved by admin"
          fi
        else
          echo " No sensitive files changed"
        fi
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Set up caching
      uses: actions/cache@v3
      with:
        path: ~/.local/share/virtualenvs
        key: ${{ runner.os }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pipenv-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        pipenv install --dev
        # Install the package in development mode to make it discoverable for tests
        pipenv run pip install -e .
    - name: Test with pytest
      run: |
        pipenv run pytest --cov=. --cov-report=xml
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: success()
      with:
        fail_ci_if_error: false
        
    # Auto-approve the PR if it's an automated PR and tests pass
    - name: Auto-approve PR
      if: success() && contains(github.event.pull_request.labels.*.name, 'automated-pr')
      uses: hmarr/auto-approve-action@v3
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        
    # Auto-merge the PR if it's an automated PR and tests pass
    - name: Auto-merge PR
      if: |
        success() && 
        contains(github.event.pull_request.labels.*.name, 'automated-pr') &&
        !contains(github.event.pull_request.labels.*.name, 'hold-merge') &&
        needs.security-check.result == 'success'
      uses: pascalgn/automerge-action@v0.15.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MERGE_LABELS: "automated-pr"
        MERGE_METHOD: "squash"
        MERGE_COMMIT_MESSAGE: "Auto-merge PR from dev branch"
