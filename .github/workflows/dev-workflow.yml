name: Dev Branch Checks

on:
  push:
    branches-ignore: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Set up caching
      uses: actions/cache@v3
      with:
        path: ~/.local/share/virtualenvs
        key: ${{ runner.os }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pipenv-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        pipenv install --dev
    - name: Lint
      run: |
        pipenv run flake8 .
        pipenv run mypy .
    - name: Format check
      run: |
        pipenv run black --check .
        pipenv run isort --check .
    
    # Extract current branch name
    - name: Extract branch name
      id: extract_branch
      shell: bash
      run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

    # Auto-create PR to main if checks pass
    - name: Create Pull Request to main
      if: success() && steps.extract_branch.outputs.branch != 'main'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Auto PR from ${{ steps.extract_branch.outputs.branch }} to main"
        title: 'Auto PR: ${{ steps.extract_branch.outputs.branch }} to Main'
        body: |
          This PR was automatically created after successful checks on the `${{ steps.extract_branch.outputs.branch }}` branch.
          It contains the latest changes that passed all linting and formatting checks.
        branch: pr-${{ steps.extract_branch.outputs.branch }}-to-main
        base: main
        labels: automated-pr
