name: Dev Branch Checks

on:
  push:
    branches-ignore: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Set up caching
      uses: actions/cache@v3
      with:
        path: ~/.local/share/virtualenvs
        key: ${{ runner.os }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pipenv-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        pipenv install --dev
    - name: Lint
      run: |
        pipenv run flake8 .
        pipenv run mypy .
    - name: Format check
      run: |
        pipenv run black --check .
        pipenv run isort --check .
    
    # Extract current branch name
    - name: Extract branch name
      id: extract_branch
      shell: bash
      run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
      
    # Auto-create PR to main if checks pass using GitHub CLI
    - name: Create Pull Request to main
      if: success() && steps.extract_branch.outputs.branch != 'main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH_NAME: ${{ steps.extract_branch.outputs.branch }}
      run: |
        # Check if PR already exists
        existing_pr=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')
        
        if [ -z "$existing_pr" ]; then
          # Create new PR if one doesn't exist
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Auto PR: $BRANCH_NAME to Main" \
            --body "This PR was automatically created after successful checks on the \`$BRANCH_NAME\` branch.\nIt contains the latest changes that passed all linting and formatting checks." \
            --label automated-pr
          echo "Created new PR from $BRANCH_NAME to main"
        else
          echo "PR already exists: #$existing_pr"
        fi
