name: Dev Branch Checks

on:
  push:
    branches: [ dev ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Set up caching
      uses: actions/cache@v3
      with:
        path: ~/.local/share/virtualenvs
        key: ${{ runner.os }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pipenv-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        pipenv install --dev
    - name: Lint
      run: |
        pipenv run flake8 .
        pipenv run mypy .
    - name: Format check
      run: |
        pipenv run black --check .
        pipenv run isort --check .
    
    # Auto-create PR to main if checks pass
    - name: Create Pull Request to main
      if: success()
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: Auto PR from dev to main
        title: 'Auto PR: Dev to Main'
        body: |
          This PR was automatically created after successful dev branch checks.
          It contains the latest changes from the dev branch that passed all linting and formatting checks.
        branch: auto-pr-to-main
        base: main
        labels: automated-pr
